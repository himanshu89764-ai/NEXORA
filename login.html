<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NEXORA Login</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- NAVBAR -->

    <header class="navbar">

        <div class="logo">
            <span class="logo-icon">N</span>
            <span>NEXORA</span>
        </div>

        <a href="index.html" class="home-link">
            ← Home
        </a>

    </header>


    <!-- LOGIN -->

    <main>

        <section class="auth-page">

            <div class="auth-card">

                <div class="answer-label">
                    ✦ NEXORA ACCOUNT
                </div>

                <h1>
                    Welcome Back
                </h1>

                <p class="auth-subtitle">
                    Login to continue your NEXORA journey.
                </p>


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="loginEmail">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="loginEmail"
                        placeholder=" enter the email "
                    >

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="loginPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="enter the password"
                    >

                </div>


                <!-- LOGIN BUTTON -->

                <button
                    type="button"
                    class="main-cta auth-button"
                    id="loginButton">

                    Login →

                </button>


                <!-- SIGNUP -->

                <p class="auth-switch">

                    Don't have an account?

                    <a href="signup.html">
                        Create Account
                    </a>

                </p>


                <!-- DEMO NOTE -->

                <div class="auth-note">

                    Demo login is currently running locally.
                    Real authentication will be connected later.

                </div>

            </div>

        </section>

    </main>


    <!-- JAVASCRIPT -->

    <script src="login.js"></script>

</body>

</html>
