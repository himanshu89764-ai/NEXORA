<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>NEXORA Create Account</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>


    <!-- NAVBAR -->

    <header class="navbar">

        <div class="logo">

            <span class="logo-icon">
                N
            </span>

            <span>
                NEXORA
            </span>

        </div>


        <a
            href="index.html"
            class="home-link"
        >
            ← Home
        </a>

    </header>



    <!-- SIGNUP -->

    <main>

        <section class="auth-page">

            <div class="auth-card">


                <div class="answer-label">
                    ✦ NEXORA ACCOUNT
                </div>


                <h1>
                    Create Your Account
                </h1>


                <p class="auth-subtitle">
                    Start your journey with NEXORA.
                </p>



                <!-- NAME -->

                <div class="form-group">

                    <label for="signupName">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="signupName"
                        placeholder="Enter your name"
                    >

                </div>



                <!-- EMAIL -->

                <div class="form-group">

                    <label for="signupEmail">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="signupEmail"
                        placeholder="Enter your email"
                    >

                </div>



                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="signupPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="signupPassword"
                        placeholder="Create a password"
                    >

                </div>



                <!-- CONFIRM PASSWORD -->

                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                    >

                </div>



                <!-- SIGNUP BUTTON -->

                <button
                    type="button"
                    class="main-cta auth-button"
                    id="signupButton"
                >
                    Create Account →
                </button>



                <!-- LOGIN LINK -->

                <p class="auth-switch">

                    Already have an account?

                    <a href="login.html">
                        Login
                    </a>

                </p>



                <!-- NOTE -->

                <div class="auth-note">

                    Demo account creation is currently running
                    locally. Real authentication will be connected
                    later.

                </div>


            </div>

        </section>

    </main>


    <!-- JAVASCRIPT -->

    <script src="signup.js"></script>

</body>

</html>
