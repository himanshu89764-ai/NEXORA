/* NEXORA SHORT NOTES INTRO FINAL V2 */
(function(){
  function updateShortNotesIntro(){
    const intro=document.getElementById("shortNotesIntro");
    if(!intro) return;

    const exam=document.getElementById("shortNotesExam");
    const value=((exam && (exam.value || exam.options?.[exam.selectedIndex]?.text)) || "").trim().toLowerCase();

    const isNCERT=value.includes("ncert");

    intro.textContent=isNCERT
      ? "Select Class, Subject, Book and Chapter to generate structured, exam-focused NEXORA notes with Prelims MCQs and Mains practice."
      : "Select Exam, Subject, Book and Chapter to generate structured, exam-focused NEXORA notes with Prelims MCQs and Mains practice.";
  }

  document.addEventListener("DOMContentLoaded",function(){
    updateShortNotesIntro();

    const exam=document.getElementById("shortNotesExam");
    if(exam){
      exam.addEventListener("change",updateShortNotesIntro);
      exam.addEventListener("input",updateShortNotesIntro);
    }

    setTimeout(updateShortNotesIntro,300);
    setTimeout(updateShortNotesIntro,1000);
  });
})();
</script>



<!-- NEXORA_DIRECT_BOOK_AUTHORITY_FINAL -->
<script>
(function(){
"use strict";

const exam=document.getElementById("shortNotesExam");
const cls=document.getElementById("shortNotesClass");
const subject=document.getElementById("shortNotesSubject");
const book=document.getElementById("shortNotesBook");
const chapter=document.getElementById("shortNotesChapter");

if(!exam||!subject||!book||!chapter)return;

let books=[];
let busy=false;

const norm=v=>String(v||"").trim().toLowerCase().replace(/[^a-z0-9]+/g,"");

function subjectMatch(a,b){
 const x=norm(a),y=norm(b);
 if(!x||!y)return false;
 if(x===y)return true;

 const groups=[
  ["history","socialscience","socialstudies"],
  ["geography","socialscience","socialstudies"],
  ["polity","politicalscience","civics","socialscience"],
  ["economy","economics"],
  ["culture","artandculture"],
  ["science","generalscience"],
  ["mathematics","maths","math"],
  ["biology","science"],
  ["chemistry","science"],
  ["physics","science"],
  ["english","englishlanguage"],
  ["hindi","hindilanguage"]
 ];

 for(const g of groups){
  if(g.includes(x)&&g.includes(y)) return true;
 }

 return false;
}

function isNCERT(){
 const v=norm(cls&&cls.value);
 return !!v && /^class\d+$/.test(v);
}

async function load(){
 if(busy)return;
 busy=true;
 try{
  const r=await fetch("/api/short-notes/universal-catalogue?final=1&_="+Date.now(),{cache:"no-store"});
  const d=await r.json();
  books=Array.isArray(d.books)?d.books:[];
  renderBooks();
 }catch(e){
  console.error("NEXORA DIRECT BOOK FINAL:",e);
 }finally{
  busy=false;
 }
}

function renderBooks(){
 if(!subject.value)return;

 const ncert=isNCERT();
 let list=books.filter(b=>{ if(subjectMatch(b.subject,subject.value))return true; const q=norm(subject.value).replace(/[^a-z0-9]/g,""); const id=norm(b.id); const title=norm(b.title||b.titleEn||""); const author=norm(b.author); if(q==="history" && (id.includes("history") || title.includes("history") || author==="ncert"))return true; if(q==="geography" && (id.includes("geography") || title.includes("geography") || author==="ncert"))return true; if(q==="polity" && (id.includes("polity") || title.includes("politics") || title.includes("constitution") || author==="ncert"))return true; return false; });

  if(ncert){
  const selectedClass=String(cls?.value||"")
    .toLowerCase()
    .replace(/[^a-z0-9]/g,"");

  list=list.filter(b=>{
    const rawClass=String(
      b.class||b.className||b.classLabel||b.standard||b.grade||""
    ).toLowerCase().replace(/[^a-z0-9]/g,"");

    const classNumber=selectedClass.replace(/^class/,"");
    const rawNumber=rawClass.replace(/^class/,"");

    const classMatch=
      rawNumber===classNumber ||
      rawClass===selectedClass ||
      ("class"+rawNumber)===selectedClass;

    if(!classMatch)return false;

    const kind=norm(b.kind);
    const source=norm(b.source);
    const id=norm(b.id);
    const title=norm(b.title||b.titleEn||"");

    /*
     * NCERT AUTHORITY:
     * official:true is deliberately NOT used.
     * manifestjs is deliberately NOT used.
     * Both can contain standard/reference records.
     */
    const ncertMatch=
      kind==="ncert" ||
      kind.includes("ncert") ||
      source==="ncert" ||
      source==="ncertbooks" ||
      id.startsWith("ncert") ||
      id.startsWith("class"+classNumber+"ncert") ||
      title.includes("ncert");

    return ncertMatch;
  });
}else{
  list=list.filter(b=>!norm(b.kind).includes("ncert"));
}

 const seen=new Set();
 list=list.filter(b=>{
  const k=String(b.id||b.title||"");
  if(seen.has(k))return false;
  seen.add(k);
  return true;
 });

 const old=book.value;

 book.innerHTML="";
 const first=document.createElement("option");
 first.value="";
 first.textContent=list.length?"Select Book":"No Book Available";
 book.appendChild(first);

 list.forEach(b=>{
  const o=document.createElement("option");
  o.value=b.id||b.title||"";
  o.textContent=b.author?`${b.title} — ${b.author}`:(b.title||b.titleEn||"Book");
  o.dataset.chapters=JSON.stringify(Array.isArray(b.chapters)?b.chapters:[]);
  o.dataset.bookTitle=b.title||b.titleEn||"";
  o.dataset.author=b.author||"";
  book.appendChild(o);
 });

 book.disabled=false;

 if(old && [...book.options].some(o=>o.value===old))book.value=old;

 renderChapters();

 console.log(
  "NEXORA DIRECT FINAL:",
  ncert?"NCERT":"STANDARD",
  "CLASS=",cls?cls.value:"",
  "SUBJECT=",subject.value,
  "BOOKS=",list.length
 );
}

function renderChapters(){
 const o=book.options[book.selectedIndex];
 chapter.innerHTML='<option value="">Select Chapter</option>';
 chapter.disabled=true;

 if(!o||!o.value)return;

 const selected=books.find(
   b=>String(b.id||b.title||"")===String(o.value)
 );

 let list=[];

 if(selected){
   if(Array.isArray(selected.chapters)){
     list=selected.chapters;
   }else if(Array.isArray(selected.chapterList)){
     list=selected.chapterList;
   }else if(Array.isArray(selected.contents)){
     list=selected.contents;
   }
 }

 if(!list.length){
   try{
     const raw=JSON.parse(o.dataset.chapters||"[]");
     if(Array.isArray(raw))list=raw;
   }catch(e){}
 }

 list=list.map(x=>{
   if(typeof x==="string")return x.trim();
   if(x&&typeof x==="object"){
     return String(
       x.title||
       x.name||
       x.chapter||
       x.chapterTitle||
       x.label||
       x.text||
       ""
     ).trim();
   }
   return String(x||"").trim();
 }).filter(Boolean);

 const seen=new Set();
 list=list.filter(x=>{
   const k=x.toLowerCase();
   if(seen.has(k))return false;
   seen.add(k);
   return true;
 });

 list.forEach((x,i)=>{
   const c=document.createElement("option");
   c.value=x;
   c.textContent=(i+1)+". "+x;
   chapter.appendChild(c);
 });

 chapter.disabled=list.length===0;

 console.log(
   "NEXORA CHAPTER AUTHORITY:",
   o.textContent,
   "TYPE=",isNCERT()?"NCERT":"STANDARD",
   "CLASS=",cls?.value||"",
   "SUBJECT=",subject.value,
   "CHAPTERS=",list.length
 );
}

exam.addEventListener("change",load,true);
subject.addEventListener("change",load,true);
if(cls)cls.addEventListener("change",load,true);
book.addEventListener("change",renderChapters,true);

load();

setInterval(()=>{
 if(subject.value && !book.options.length)load();
 if(subject.value && book.options.length<=1)renderBooks();
},1000);

console.log("NEXORA DIRECT BOOK AUTHORITY FINAL: ACTIVE");
})();
</script>

<script>(function(){function init(){var btn=document.getElementById('shortNotesButton');if(!btn||btn.dataset.finalNotes==='1')return;btn.dataset.finalNotes='1';btn.addEventListener('click',async function(e){e.preventDefault();e.stopImmediatePropagation();var exam=document.getElementById('shortNotesExam'),cls=document.getElementById('shortNotesClass'),subject=document.getElementById('shortNotesSubject'),book=document.getElementById('shortNotesBook'),chapter=document.getElementById('shortNotesChapter'),language=document.getElementById('shortNotesLanguage'),mode=document.getElementById('shortNotesMode'),status=document.getElementById('shortNotesStatus');var sv=subject&&subject.value||'',bv=book&&book.value||'',cv=chapter&&chapter.value||'';if(!sv){status.textContent='Please select Subject';return}if(!bv){status.textContent='Please select Book';return}if(!cv){status.textContent='Please select Chapter';return}btn.disabled=true;btn.textContent='Generating Short Notes PDF...';status.textContent='NEXORA is generating your notes...';try{var r=await fetch('/api/short-notes',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({exam:exam&&exam.value||'',className:cls&&cls.value||'',class:cls&&cls.value||'',subject:sv,bookId:bv,bookTitle:book&&book.options[book.selectedIndex]?book.options[book.selectedIndex].text:'',chapter:cv,chapterTitle:chapter&&chapter.options[chapter.selectedIndex]?chapter.options[chapter.selectedIndex].text:cv,language:language&&language.value||'english',mode:mode&&mode.value||'exam'})});var ct=(r.headers.get('content-type')||'').toLowerCase();if(!r.ok){var m='HTTP '+r.status;try{var j=await r.json();m=j.error||j.message||m}catch(x){}throw new Error(m)}if(ct.indexOf('pdf')<0)throw new Error(await r.text());var blob=await r.blob(),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='NEXORA-Short-Notes.pdf';document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url)},30000);status.textContent='Short Notes PDF downloaded successfully.'}catch(err){console.error('NEXORA SHORT NOTES GENERATION FINAL:',err);status.textContent='Notes generation failed: '+(err&&err.message||err)}finally{btn.disabled=false;btn.textContent='Create Short Notes PDF ->'}},true)}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init()})();</script>
