<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>NEXORA — Short Notes</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f7f9fc;color:#202124}
header{height:72px;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;padding:0 28px}
.logo{font-size:28px;font-weight:800;letter-spacing:-1px}
.logo span:nth-child(1){color:#4285f4}.logo span:nth-child(2){color:#ea4335}.logo span:nth-child(3){color:#fbbc05}.logo span:nth-child(4){color:#34a853}.logo span:nth-child(5){color:#4285f4}.logo span:nth-child(6){color:#ea4335}
.home{margin-left:auto;text-decoration:none;color:#555;font-weight:600}
main{max-width:1100px;margin:55px auto;padding:20px}
.short-notes-card{display:block!important;background:#fff;border-radius:24px;padding:35px;box-shadow:0 10px 35px rgba(0,0,0,.08)}
#shortNotesSelectors{display:flex!important;flex-wrap:wrap!important;gap:14px!important;margin:24px 0!important}
#shortNotesSelectors select{display:block!important;min-width:200px;min-height:52px;padding:12px;border:1px solid #d9dee7;border-radius:12px;background:#fff;font-size:15px}
.main-cta{display:inline-block;padding:15px 24px;border:0;border-radius:12px;background:#1a73e8;color:#fff;font-weight:700;font-size:15px;cursor:pointer}
#shortNotesStatus{color:#555}
</style>
</head>
<body>
<header>

<a class="home" href="index.html">← Home</a>

<script>
if(localStorage.getItem("nexoraLoggedIn")!=="true"){
location.href="login.html";
}
</script>
<script src="search.js"></script>
