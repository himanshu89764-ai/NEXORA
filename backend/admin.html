cd ~/Documents/NEXORA

cat > admin.html <<'EOF'
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NEXORA — Admin Analytics</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
            padding: 30px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        h1 {
            margin-bottom: 8px;
        }

        .subtitle {
            color: #6b7280;
            margin-bottom: 30px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.06);
        }

        .card h3 {
            color: #6b7280;
            font-size: 15px;
            margin-bottom: 12px;
        }

        .number {
            font-size: 36px;
            font-weight: bold;
        }

        .chart-card {
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.06);
        }

        .chart {
            margin-top: 20px;
        }

        .row {
            display: flex;
            align-items: center;
            gap: 15px;
            margin: 12px 0;
        }

        .date {
            width: 110px;
            font-size: 13px;
        }

        .bar {
            height: 25px;
            background: #111827;
            border-radius: 6px;
            min-width: 5px;
        }

        .count {
            font-weight: bold;
        }

        .status {
            margin-top: 20px;
            color: #6b7280;
            font-size: 13px;
        }

        @media (max-width: 700px) {
            body {
                padding: 15px;
            }

            .cards {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>⚡ NEXORA Admin Analytics</h1>

    <p class="subtitle">
        User registration and growth overview
    </p>

    <div class="cards">

        <div class="card">
            <h3>Total Users</h3>
            <div class="number" id="totalUsers">—</div>
        </div>

        <div class="card">
            <h3>Today</h3>
            <div class="number" id="todayUsers">—</div>
        </div>

        <div class="card">
            <h3>Yesterday</h3>
            <div class="number" id="yesterdayUsers">—</div>
        </div>

        <div class="card">
            <h3>Last 7 Days</h3>
            <div class="number" id="last7Days">—</div>
        </div>

        <div class="card">
            <h3>Last 30 Days</h3>
            <div class="number" id="last30Days">—</div>
        </div>

    </div>

    <div class="chart-card">

        <h2>Daily User Registrations</h2>

        <div id="chart" class="chart">
            Loading...
        </div>

        <div id="status" class="status">
            Loading analytics...
        </div>

    </div>

</div>

<script>

async function loadAnalytics() {

    try {

        const response =
            await fetch("/api/admin/analytics");

        const data =
            await response.json();

        if (!data.success) {
            throw new Error("Analytics request failed");
        }

        const analytics =
            data.analytics;

        document.getElementById("totalUsers").textContent =
            analytics.total_users;

        document.getElementById("todayUsers").textContent =
            analytics.today_users;

        document.getElementById("yesterdayUsers").textContent =
            analytics.yesterday_users;

        document.getElementById("last7Days").textContent =
            analytics.last_7_days;

        document.getElementById("last30Days").textContent =
            analytics.last_30_days;

        const chart =
            document.getElementById("chart");

        chart.innerHTML = "";

        const dailyUsers =
            analytics.daily_users || [];

        const maxUsers =
            Math.max(
                1,
                ...dailyUsers.map(item => item.users)
            );

        dailyUsers.forEach(item => {

            const row =
                document.createElement("div");

            row.className = "row";

            const date =
                document.createElement("div");

            date.className = "date";
            date.textContent = item.date;

            const bar =
                document.createElement("div");

            bar.className = "bar";

            bar.style.width =
                Math.max(
                    5,
                    (item.users / maxUsers) * 70
                ) + "%";

            const count =
                document.createElement("div");

            count.className = "count";
            count.textContent =
                item.users;

            row.appendChild(date);
            row.appendChild(bar);
            row.appendChild(count);

            chart.appendChild(row);

        });

        document.getElementById("status").textContent =
            "Analytics loaded successfully • " +
            new Date().toLocaleTimeString();

    } catch (error) {

        console.error(error);

        document.getElementById("status").textContent =
            "❌ Unable to load analytics";

    }

}

loadAnalytics();

setInterval(
    loadAnalytics,
    30000
);

</script>

</body>
</html>
EOF
